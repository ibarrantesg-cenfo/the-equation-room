{id:'value',x:3.1,y:6.4,label:'Obelisco del Sol',icon:'☀',kind:'puzzle',color:'#edb75e',title:'Obelisco del Sol',story:'Una banda de piedra muestra la expresión y, en un anillo exterior, dos valores. El mecanismo solo responde al resultado final.',math:'2a²b − 3b²',question:'En el anillo exterior se lee: a = −2 y b = 3. Introduce el número que activa el obelisco.',type:'number',solution:'-3',fragment:'Sol',hint:'Sustituye primero las variables. El término 2a²b se evalúa antes de restar 3b².'},
{id:'monomial',x:8.4,y:10.2,label:'Balanza ceremonial',icon:'⚖',kind:'puzzle',color:'#d1bd83',title:'Balanza ceremonial',story:'Los contrapesos tienen el mismo grabado literal. Si la suma es correcta, la balanza libera un sello.',math:'7m²n − 4m²n + m²n',question:'Escribe el único monomio equivalente que deja la balanza en equilibrio.',type:'monomial',solution:'4m²n',fragment:'Arena',hint:'Los tres términos son semejantes. Conserva el factor literal exacto y combina solo los coeficientes.'},
{id:'factor',x:13.2,y:9.2,label:'Puerta de las dos lunas',icon:'◈',kind:'puzzle',color:'#87c6b4',title:'Puerta de las dos lunas',story:'Dos bloques idénticos se desplazan hacia lados opuestos si reconstruyes la forma multiplicativa correcta.',math:'4x² − 25',question:'Escribe una factorización completa que abra la puerta.',type:'factor',solution:'(2x−5)(2x+5)',fragment:'Luna',hint:'Observa que 4x² y 25 son cuadrados perfectos.'},
{id:'product',x:11.8,y:3.8,label:'Mapa de constelaciones',icon:'✧',kind:'puzzle',color:'#b5a9ed',title:'El firmamento oculto',tag:'IV · Producto de polinomios',story:'Dos trayectorias celestes se intersectan. El mapa revela su patrón únicamente si multiplicas ambos factores.',math:'(x + 4)(x − 3)',question:'Escribe el polinomio desarrollado (ejemplo: x^2+2x+1).',type:'poly',solution:'x² + x − 12',fragment:'Estrella',hint:'Usa la propiedad distributiva: cada término del primer paréntesis multiplica a cada término del segundo.'},

{id:'plaque',x:15,y:6.6,label:'Estela de la expedición',icon:'⌁',kind:'note',desc:'Inscripción en piedra'}];const done=new Set();const seq=['value','monomial','factor','product','rational'];function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(1,0,0,1,0,0);depth=new Float32Array(Math.max(1,Math.ceil(W/3)))}addEventListener('resize',resize);resize();function wall(x,y){let a=Math.floor(x),b=Math.floor(y);return b<0||b>=grid.length||a<0||a>=grid[0].length||grid[b][a]===1}function clamp(v,min,max){return Math.min(max,Math.max(min,v))}function dist(o){return Math.hypot(o.x-p.x,o.y-p.y)}function norm(a){return Math.atan2(Math.sin(a),Math.cos(a))}function direction(o){return norm(Math.atan2(o.y-p.y,o.x-p.x)-p.a)}function visible(o){return dist(o)<2.2&&Math.abs(direction(o))<.62}function notice(s){$('toast').textContent=s;$('toast').classList.add('show');toastUntil=performance.now()+2900}function beep(freq=440,ms=110){if(!audio)return;try{audioCtx ||=new (window.AudioContext||window.webkitAudioContext)();let osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.value=.045;osc.connect(gain).connect(audioCtx.destination);osc.start();gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+ms/1000);osc.stop(audioCtx.currentTime+ms/1000)}catch(e){}}function refresh(){$('count').textContent=done.size+' / 5';$('fails').textContent=errors;$('hints').textContent=hints;$('inv').textContent=done.size?Array.from(done).map(id=>objects.find(o=>o.id===id).fragment).join(' · '):'Diario de expedición'}function open(html){modal=true;keys.clear();$('overlay').classList.remove('hidden');$('sheet').innerHTML=html;const close=$('closeModal');if(close)close.onclick=hide}function hide(){if(!started)return;modal=false;$('overlay').classList.add('hidden')}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"' function startAmbience(){let a=getAudio();if(!a||ambienceNodes.length)return;const master=a.createGain();master.gain.value=.027;master.connect(a.destination);const voices=[55,82.41,110,164.81];for(let f of voices){let osc=a.createOscillator(),g=a.createGain();osc.type='sine';osc.frequency.value=f;g.gain.value=f<100?.34:.12;osc.connect(g).connect(master);osc.start();ambienceNodes.push(osc)}let low=a.createBiquadFilter();low.type='lowpass';low.frequency.value=440;let noise=a.createBuffer(1,a.sampleRate*2,a.sampleRate),ar=noise.getChannelData(0);for(let i=0;i<ar.length;i++)ar[i]=(Math.random()*2-1)*.22;let source=a.createBufferSource();source.buffer=noise;source.loop=true;let ng=a.createGain();ng.gain.value=.12;source.connect(low).connect(ng).connect(master);source.start();ambienceNodes.push(source);ambienceNodes.push(master)}

function footsteps(dt){if(!audio||modal)return;let walking=['KeyW','KeyS','KeyA','KeyD','ArrowUp','ArrowDown'].some(k=>keys.has(k));if(walking){stepClock+=dt;if(stepClock>.43){stepClock=0;tone(75,.09,.018,'triangle');tone(115,.045,.012,'sine',.045)}}else stepClock=0}
function intro(){open(`<div class="eyebrow">Nébara · 1928 · Bitácora inicial</div><div class="hero-banner"><img src="assets/damian-action.png" alt="Damián Vela corriendo entre ruinas"><div class="copy"><h3>Damián Vela entra en escena</h3><p>Arqueólogo de campo, especialista en estructuras antiguas y el único sobreviviente de la Expedición 07 tras el derrumbe en la selva de Nébara.</p><div class="portrait-pill"><img src="assets/damian-portrait.png" alt="Retrato de Damián Vela">PROTAGONISTA OFICIAL DEL AVANCE</div></div></div><h1>THE EQUATION ROOM<br><span style="color:#d6ad70">La ruta de Nébara</span></h1><p>Siguiendo una calzada oculta en la selva, Damián llegó hasta un santuario subterráneo. Los mecanismos no explican qué técnica utilizar: solo muestran símbolos, relaciones y consecuencias. Tendrás que inferir el procedimiento correcto y resolver cada inscripción con precisión.</p><div class="note">«Cinco sellos custodian la cámara central. El último portal no distingue aventureros de intrusos: solo reconoce equivalencias verdaderas».</div><p>Explora en primera persona, examina artefactos y ayuda a Damián a recuperar los cinco sellos de Nébara.</p><div class="flex"><button class="cta" id="begin">INICIAR EXPEDICIÓN →</button></div><p class="mini">WASD para moverte · Ratón o flechas para girar · E para examinar · El botón ♫ activa el ambiente después de entrar.</p>`);$('begin').onclick=()=>{started=true;startAt=performance.now();hide();notice('GUÍA A DAMIÁN VELA Y RECUPERA LOS CINCO SELLOS');beep(280,220)}}function menuNote(o){let text=o.id==='journal'?`«Si estoy leyendo bien esta civilización, no marcaban el método. Esperaban que el viajero dedujera la transformación correcta al observar la piedra y su simetría. Las restricciones no desaparecen aunque un factor se cancele ante tus ojos».<br><br>— Damián Vela, registro personal`: `«Los guardianes protegían el conocimiento disfrazándolo de ornamento. Una balanza puede ocultar una suma de términos semejantes. Dos piedras opuestas pueden ocultar un producto. Lo importante no es reconocer el nombre del tema, sino la estructura que estás viendo».`;open(`<button class="close" id="closeModal">×</button><div class="eyebrow">Documento recuperado · Registro de campo</div><h2>${o.label}</h2><div class="note">${text}</div><div class="flex"><button class="cta" id="ok">CONTINUAR EXPLORANDO</button></div>`);$('ok').onclick=hide}function canonical(s){return String(s).toLowerCase().replace(/\s/g,'').replace(/[−–—]/g,'-').replace(/[²]/g,'^2').replace(/[³]/g,'^3').replace(/[×·•]/g,'*').replace(/\{/g,'(').replace(/\}/g,')')}function polyParse(s){s=canonical(s).replace(/\*/g,'').replace(/[()]/g,'');if(!s||!/^[+\-0-9x^]+$/.test(s))return null;let tokens=s.replace(/-/g,'+-').split('+').filter(Boolean),coeff=[0,0,0];for(let t of tokens){let m=t.match(/^(-?\d*)(x(?:\^([12]))?)?$/);if(!m)return null;let power=m[2]?(m[3]?+m[3]:1):0;let c=m[1]===''||m[1]===undefined?1:m[1]==='-'?-1:Number(m[1]);if(!m[2]&&m[1]==='')return null;coeff[power]+=c}return coeff}function samePoly(s,arr){let a=polyParse(s);return a!==null&&arr.every((n,i)=>a[i]===n)}function factorCheck(s){let t=canonical(s).replace(/\*/g,'').replace(/[()]/g,'');return /^(2x-5)(2x\+5)$/.test(t)||/^(2x\+5)(2x-5)$/.test(t)}function monomialCheck(s){let t=canonical(s).replace(/\*/g,'').replace(/[()]/g,'');return ['4m^2n','m^2n4','4nm^2'].includes(t)||(/^4/.test(t)&&t.includes('m^2')&&t.includes('n')&&!t.includes('+')&&!t.includes('-'))}function rationalCheck(s){let t=canonical(s).replace(/\*/g,'').replace(/\s/g,'');let ok=['3(x+3)/(x+4)','(3(x+3))/(x+4)','(3x+9)/(x+4)'].some(v=>canonical(v)===t);return ok||(/^3\(?x\+3\)?\/\(?x\+4\)?$/.test(t))||(/^\(?3x\+9\)?\/\(?x\+4\)?$/.test(t))}function restrictions(s){let n=(s.match(/-?\d+/g)||[]).map(Number).sort((a,b)=>a-b);return n.length===2&&n[0]===-4&&n[1]===1}function correct(o){let s=$('answer')?.value||'';if(o.type==='number')return Number(s)===-3&&s.trim()!=='';if(o.type==='monomial')return monomialCheck(s);if(o.type==='factor')return factorCheck(s);if(o.type==='poly')return samePoly(s,[-3,5,2]);if(o.type==='rational')return rationalCheck(s)&&restrictions($('restrict')?.value||'');return false}function puzzle(o){let prev=seq.indexOf(o.id);let locked=prev>0&&!done.has(seq[prev-1]);let completed=done.has(o.id);open(`<button class="close" id="closeModal">×</button><div class="eyebrow">Mecanismo ancestral ${completed?'· RESUELTO':''}</div><h2>${o.title}</h2><p>${o.story}</p><div class="math">${o.math}</div><p>${o.question}</p>${locked?`<div class="note">La piedra sigue inactiva. Antes debes restaurar el mecanismo anterior: ${objects.find(x=>x.id===seq[prev-1]).label}.</div>`:completed?`<div class="stamp">✓ SELLO RECUPERADO: ${o.fragment.toUpperCase()}</div><p>El mecanismo reconoce tu equivalencia y permanece activo.</p>`:`<label class="mini" for="answer">TU RESPUESTA</label><input id="answer" autocomplete="off" spellcheck="false" placeholder="Escribe tu solución">${o.type==='rational'?`<label class="mini" for="restrict">VALORES PROHIBIDOS PARA x (ej.: -4, 1)</label><input id="restrict" autocomplete="off" placeholder="Dos valores separados por coma">`:''}<div class="feedback" id="feedback" aria-live="polite"></div><div class="hint" id="hint">${o.hint}</div>`}<div class="flex">${!locked&&!completed?`<button class="cta" id="submit">ACTIVAR MECANISMO</button><button class="secondary" id="help">REVELAR PISTA</button>`:''}<button class="secondary" id="back">VOLVER A LA CÁMARA</button></div>`);$('back').onclick=hide;if(!locked&&!completed){$('submit').onclick=()=>{if(correct(o)){done.add(o.id);refresh();ritual(true);beep(660,300);shake=8;open(`<div class="eyebrow">Cámara de Nébara · mecanismo restaurado</div><h2>✧ Sello recuperado</h2><div class="math">${o.fragment.toUpperCase()}</div><p>Has resuelto correctamente <b>${o.title}</b>. El artefacto ha despertado y Damián registra el hallazgo en su cuaderno.</p><div class="stamp">PROGRESO: ${done.size} DE 5 SELLOS</div><div class="flex"><button class="cta" id="continue">REGRESAR A LA EXCAVACIÓN →</button></div>`);$('continue').onclick=()=>{hide();notice(done.size===5?'LOS CINCO SELLOS ESTÁN COMPLETOS. BUSCA EL SARCÓFAGO.':'UN NUEVO ARTEFACTO RESPONDE EN LA OSCURIDAD')}}else{errors++;refresh();shake=4;ritual(false);beep(150,190);$('feedback').textContent='La piedra no acepta la respuesta. Revisa signos, factores, desarrollo y equivalencias. Si simplificas una fracción, no olvides los valores prohibidos.'}};$('help').onclick=()=>{if($('hint').style.display!=='block'){hints++;refresh();$('hint').style.display='block'}};$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'&&o.type!=='rational')$('submit').click()})}}function ending(){if(done.size!==5){open(`<button class="close" id="closeModal">×</button><div class="eyebrow">La última cámara</div><h2>El sarcófago permanece sellado</h2><p>Necesitas los cinco sellos para descifrar el mapa astral. Has encontrado <b>${done.size} de 5</b>.</p><div class="flex"><button class="cta" id="ok">SEGUIR INVESTIGANDO</button></div>`);$('ok').onclick=hide;return}let secs=Math.floor((performance.now()-startAt)/1000);open(`<div class="eyebrow">Expedición 07 · Registro desclasificado</div><h1>EL AMANECER DE NÉBARA</h1><p>El sarcófago se abre frente a Damián Vela. En su interior no hay oro: hay un mapa del cielo y las anotaciones de una civilización que convirtió las matemáticas en la llave de su conocimiento.</p><div class="note">«No temas a la incógnita. Aprende a encontrarla».</div><h2 style="font-size:27px">¡Damián ha escapado!</h2><p class="stamp">5 / 5 SELLOS · ${errors} ERRORES · ${hints} PISTAS · ${Math.floor(secs/60)}m ${secs%60}s</p><div class="flex"><button class="cta" id="restart">INICIAR NUEVA EXPEDICIÓN</button></div>`);$('restart').onclick=()=>location.reload()}function interact(){if(modal)return;let c=objects.filter(visible).sort((a,b)=>dist(a)-dist(b))[0];if(!c){notice('ACÉRCATE A UN ARTEFACTO PARA EXAMINARLO');return}beep(410,70);if(c.kind==='note')menuNote(c);else if(c.kind==='puzzle')puzzle(c);else ending()}function mapModal(){let m=raw.map((r,y)=>r.split('').map((v,x)=>v==='1'?'▓':'·').join('')).join('\n');open(`<button class="close" id="closeModal">×</button><div class="eyebrow">Bitácora · Plano parcial</div><h2>Mapa de la cámara</h2><pre style="overflow:auto;font-size:clamp(10px,1.65vw,17px);letter-spacing:.16em;line-height:1.5;color:#d6b780">${m}</pre><p>Los artefactos están distribuidos por toda la sala. Busca sus brillos entre las paredes y acércate para examinarlos.</p><button class="cta" id="ok">CERRAR MAPA</button>`);$('ok').onclick=hide}function journalModal(){open(`<button class="close" id="closeModal">×</button><div class="eyebrow">Cuaderno de campo · Dossier del explorador</div><h2>Diario de Damián Vela</h2><img class="sheet-preview" src="assets/damian-concept-sheet.jpg" alt="Hoja de diseño del explorador arqueológico"><p>Has resuelto ${done.size} de 5 sellos. Los mecanismos responden solo a transformaciones correctas y ya no te dicen explícitamente qué estrategia usar. Debes reconocer la estructura de cada inscripción.</p><div class="note">${seq.map((id,i)=>`${done.has(id)?'✓':'◇'} ${i+1}. ${objects.find(o=>o.id===id).title}`).join('<br>')}</div><p><b>Perfil del protagonista:</b> Damián Vela, arqueólogo de campo, viajero de selvas y ruinas, especialista en lectura estructural de artefactos. Su equipo quedó atrapado tras un derrumbe, y ahora depende de tu razonamiento para salir de Nébara.</p><button class="cta" id="ok">VOLVER</button>`);$('ok').onclick=hide}function move(dt){if(modal)return;let speed=Math.min(dt,.04)*3.0,rot=Math.min(dt,.04)*1.95;if(keys.has('ArrowLeft')||keys.has('KeyQ'))p.a-=rot;if(keys.has('ArrowRight'))p.a+=rot;let forward=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0),side=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0);let dx=(Math.cos(p.a)*forward+Math.cos(p.a+Math.PI/2)*side)*speed,dy=(Math.sin(p.a)*forward+Math.sin(p.a+Math.PI/2)*side)*speed;let r=.23;if(!wall(p.x+dx+Math.sign(dx)*r,p.y))p.x+=dx;if(!wall(p.x,p.y+dy+Math.sign(dy)*r))p.y+=dy;p.a=norm(p.a)}function draw(){frame++;const w=W,h=H;const horizon=h*.53;const ceiling=ctx.createLinearGradient(0,0,0,horizon);ceiling.addColorStop(0,'#090e0d');ceiling.addColorStop(1,'#3f3b2b');ctx.fillStyle=ceiling;ctx.fillRect(0,0,w,horizon);const floor=ctx.createLinearGradient(0,horizon,0,h);floor.addColorStop(0,'#67523a');floor.addColorStop(.48,'#30291f');floor.addColorStop(1,'#10130f');ctx.fillStyle=floor;ctx.fillRect(0,horizon,w,h-horizon);const fov=Math.PI/2.75,stride=Math.max(2,Math.floor(w/430));let rays=Math.ceil(w/stride);depth=new Float32Array(rays);for(let i=0;i<rays;i++){const ra=p.a+Math.atan((i/rays-.5)*2*Math.tan(fov/2));let rx=Math.cos(ra),ry=Math.sin(ra),mx=Math.floor(p.x),my=Math.floor(p.y),ddx=Math.abs(1/rx),ddy=Math.abs(1/ry),sx=rx<0?-1:1,sy=ry<0?-1:1,sdx=(rx<0?p.x-mx:mx+1-p.x)*ddx,sdy=(ry<0?p.y-my:my+1-p.y)*ddy;let side=0,d=0;for(let t=0;t<28;t++){if(sdx<sdy){mx+=sx;d=sdx;sdx+=ddx;side=0}else{my+=sy;d=sdy;sdy+=ddy;side=1}if(wall(mx+.5,my+.5))break}d=Math.max(.08,d*Math.cos(ra-p.a));depth[i]=d;const wh=Math.min(h*2,h/(d*.72)),top=horizon-wh*.52,tex=side?(p.x+d*rx)%1:(p.y+d*ry)%1;let crack=Math.sin(mx*42.4+my*29.6+Math.floor(tex*9)*8.4);let brightness=Math.max(.16,1/(1+d*.15))*(side?.77:1);let noise=(Math.sin(mx*15+my*78+Math.floor(tex*10)*9)*.5+.5)*.20;let base=[128,111,82];let rr=(base[0]+crack*7+noise*30)*brightness,gg=(base[1]+crack*5+noise*24)*brightness,bb=(base[2]+noise*18)*brightness;ctx.fillStyle=`rgb(${rr|0},${gg|0},${bb|0})`;let px=i*stride;ctx.fillRect(px,top,stride+1,wh);ctx.fillStyle=`rgba(27,22,15,${clamp(.1+d*.012,.1,.28)})`;for(let k=1;k<9;k++){let yy=top+wh*k/9+Math.sin(mx*13+my*11+k)*wh*.007;ctx.fillRect(px,yy,stride+1,Math.max(1,h/(d*500)))}if(Math.floor(tex*9)%9===0){ctx.fillStyle='#171a1490';ctx.fillRect(px,top,stride+1,wh)}if(d<15&&Math.sin(mx*5.2+my*8.8)>0.65){ctx.fillStyle=`rgba(208,168,89,${.05*brightness})`;ctx.fillRect(px,top+wh*.15,stride+1,wh*.7)}}// floor mosaic lines
ctx.save();ctx.globalAlpha=.09;for(let j=1;j<9;j++){let y=horizon+(h-horizon)*(j/9)**.44;ctx.strokeStyle='#e2b881';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.restore();
// Sinuous roots, sand ripples and ancient cracks soften the stone geometry.
ctx.save();for(let n=0;n<19;n++){let xx=(n*179.7%w),yy=horizon+(h-horizon)*(.08+(n*37%85)/100);let radius=(yy-horizon)/(h-horizon);ctx.lineWidth=Math.max(.7,2.8*radius);ctx.strokeStyle=n%3===0?'#91764b40':'#211d174d';ctx.beginPath();ctx.moveTo(xx-55*radius,yy+7*radius);ctx.bezierCurveTo(xx-19*radius,yy-10*radius,xx+25*radius,yy+9*radius,xx+65*radius,yy-3*radius);ctx.stroke()}ctx.restore();
let sprites=objects.map(o=>({...o,d:dist(o),angle:direction(o)})).filter(o=>Math.abs(o.angle)<fov*.9&&o.d<19).sort((a,b)=>b.d-a.d);for(const o of sprites){let x=w/2+Math.tan(o.angle)/Math.tan(fov/2)*w/2,ix=Math.floor(x/stride);if(ix<0||ix>=rays||o.d>depth[ix]+.8)continue;let scale=Math.min(h*.59,h/(o.d*.95)),y=horizon-scale*.36,big=o.id==='door'?1.55:o.id==='journal'?.55:1;scale*=big;const color=o.kind==='note'?'#e6c28a':o.color;ctx.save();ctx.globalAlpha=clamp(1-o.d/26,.35,1);const glow=ctx.createRadialGradient(x,y,0,x,y,scale*(.79+.045*Math.sin(frame*.044+o.x)));glow.addColorStop(0,color+'7a');glow.addColorStop(.5,color+'24');glow.addColorStop(1,'transparent');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y,scale*.83,0,Math.PI*2);ctx.fill();let size=scale*.52;ctx.fillStyle='#25251cf2';ctx.strokeStyle=color;ctx.lineWidth=Math.max(1,size*.034);ctx.beginPath();ctx.moveTo(x,y-size*.95);ctx.bezierCurveTo(x+size*.32,y-size*1.07,x+size*.58,y-size*.65,x+size*.55,y-size*.35);ctx.bezierCurveTo(x+size*.68,y+size*.10,x+size*.53,y+size*.62,x+size*.27,y+size*.84);ctx.quadraticCurveTo(x,y+size*1.09,x-size*.28,y+size*.84);ctx.bezierCurveTo(x-size*.58,y+size*.65,x-size*.63,y+.12*size,x-size*.55,y-size*.35);ctx.bezierCurveTo(x-size*.58,y-size*.67,x-size*.31,y-size*1.06,x,y-size*.95);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle=color+'a9';ctx.lineWidth=Math.max(1,size*.014);ctx.beginPath();ctx.ellipse(x,y+size*.05,size*.34,size*.63,0,0,Math.PI*2);ctx.stroke();ctx.shadowColor=color;ctx.shadowBlur=size*.3;ctx.fillStyle=done.has(o.id)?'#88efac':color;ctx.font=`${Math.max(17,size*.78)}px Georgia`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(done.has(o.id)?'✓':o.icon,x,y+size*.07);ctx.shadowBlur=0;if(o.d<5){ctx.fillStyle='#ffebbd';ctx.font=`${Math.max(11,Math.min(21,w/55))}px Georgia`;ctx.fillText(o.label,x,y+size*1.3)}ctx.restore()}
// floating sand particles
for(let i=0;i<65;i++){let xx=(Math.sin(i*123.3)*.5+.5)*w+Math.sin(frame*.002+i)*22,yy=(Math.sin(i*56.7)*.5+.5)*h+Math.cos(frame*.003+i)*12;ctx.fillStyle=`rgba(245,203,139,${.04+.09*(1+Math.sin(frame*.014+i))/2})`;ctx.fillRect(xx,yy,i%4===0?2:1,1)}if(shake>0){shake=Math.max(0,shake-.18)}let target=objects.filter(visible).sort((a,b)=>dist(a)-dist(b))[0];promptObj=target;$('prompt').style.display=!modal&&target?'block':'none';if(target)$('prompt').innerHTML=`<b style="color:#e5c384">[ E ] EXAMINAR</b><br>${escapeHtml(target.label)}`;if(toastUntil&&performance.now()>toastUntil){$('toast').classList.remove('show');toastUntil=0}if(started){let secs=Math.floor((performance.now()-startAt)/1000);$('timer').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')}}let last=performance.now();function tick(now){let dt=(now-last)/1000;last=now;move(dt);footsteps(dt);draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='Escape'&&modal&&started){hide();return}if(modal)return;keys.add(e.code);if(e.code==='KeyE')interact()});document.addEventListener('keyup',e=>keys.delete(e.code));let dragging=false,lx=0;canvas.addEventListener('pointerdown',e=>{if(modal)return;dragging=true;lx=e.clientX});addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointermove',e=>{if(dragging&&!modal){p.a+=clamp((e.clientX-lx)*.004,-.25,.25);lx=e.clientX}});canvas.addEventListener('click',e=>{if(!modal&&promptObj&&Math.abs(e.clientX-innerWidth/2)<innerWidth*.26)interact()});document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='KeyE')interact();else keys.add(k)});for(const event of ['pointerup','pointercancel','pointerleave'])b.addEventListener(event,()=>keys.delete(k))});const look=$('lookRight');look.addEventLi
